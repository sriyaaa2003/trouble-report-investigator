[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trouble-report-investigator"
version = "0.1.0"
description = "Retrieve similar historical trouble reports, predict the affected subsystem and present evidence; evaluated on public Mozilla Bugzilla data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "fastembed>=0.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
investigator = "investigator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "sklearn", "sklearn.*", "scipy", "scipy.*", "joblib"]
ignore_missing_imports = true
